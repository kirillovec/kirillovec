<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фото — kirillovec</title>
<meta name="description" content="Фотографии, обложки и визуальные работы проекта kirillovec.">
<link rel="canonical" href="https://kirillovec.ru/творчество/фото/">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0a0a0b;--card:#121214;--text:#e8e6e3;--muted:#8a8780;--accent:#c4a77d;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:40px 22px 72px}
.topnav{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:8px;font-size:.85rem}
.topnav a{color:var(--muted);text-decoration:none}.topnav a:hover{color:var(--accent)}
.back{color:var(--muted);text-decoration:none}
h1{font:400 clamp(2rem,5vw,3rem) Georgia,"Times New Roman",serif;margin:30px 0 8px}
.desc{color:var(--muted);margin:0 0 32px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:18px}
.card{display:block;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card);color:inherit;text-decoration:none;transition:border-color .2s,transform .2s}
.card img{display:block;width:100%;height:280px;object-fit:cover;background:#181818}
.caption{padding:12px 14px;color:var(--muted);font-size:.9rem}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.media-error img{object-fit:contain;min-height:180px;padding:24px;color:var(--muted)}
footer{margin-top:44px;border-top:1px solid var(--border);padding-top:24px;display:flex;flex-wrap:wrap;gap:16px}
footer a{color:var(--muted);text-decoration:none}footer a:hover{color:var(--accent)}
@media(max-width:560px){.wrap{padding:28px 16px 56px}.card img{height:240px}}
</style>
</head>
<body>
<main class="wrap">
<nav class="topnav">
  <a href="/">Главная</a>
  <a href="/artist/">Музыка</a>
  <a href="/творчество/">Творчество</a>
  <a href="/studio/">AI Studio</a>
</nav>
<a class="back" href="/%D1%82%D0%B2%D0%BE%D1%80%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%BE/">← Творчество</a>
<h1>📷 Фото</h1>
<p class="desc">Фотографии, обложки и визуальные работы. Нажмите на снимок, чтобы открыть его отдельно.</p>
<div class="gallery">
<a class="card" href="0.jpg" target="_blank" rel="noopener"><img src="0.jpg" alt="Фото 01" width="400" height="280" loading="lazy" decoding="async"><div class="caption">Фото 01</div></a>
<a class="card" href="11.jpeg" target="_blank" rel="noopener"><img src="11.jpeg" alt="Фото 02" width="400" height="280" loading="lazy" decoding="async"><div class="caption">Фото 02</div></a>
<a class="card" href="2.jpg" target="_blank" rel="noopener"><img src="2.jpg" alt="Фото 03" width="400" height="280" loading="lazy" decoding="async" data-fallback="2.png"><div class="caption">Фото 03</div></a>
<a class="card" href="54321.jpg" target="_blank" rel="noopener"><img src="54321.jpg" alt="Фото 04" width="400" height="280" loading="lazy" decoding="async"><div class="caption">Фото 04</div></a>
<a class="card" href="Take Me Back Kirillovec rmx SPRING.jpeg" target="_blank" rel="noopener"><img src="Take Me Back Kirillovec rmx SPRING.jpeg" alt="Take Me Back — Spring" width="400" height="280" loading="lazy" decoding="async"><div class="caption">Take Me Back — Spring</div></a>
<a class="card" href="Take Me Back — Kirillovec rmx AUTUMN.jpeg" target="_blank" rel="noopener"><img src="Take Me Back — Kirillovec rmx AUTUMN.jpeg" alt="Take Me Back — Autumn" width="400" height="280" loading="lazy" decoding="async"><div class="caption">Take Me Back — Autumn</div></a>
<a class="card" href="Take Me Back — Kirillovec rmx SUMMER.jpeg" target="_blank" rel="noopener"><img src="Take Me Back — Kirillovec rmx SUMMER.jpeg" alt="Take Me Back — Summer" width="400" height="280" loading="lazy" decoding="async"><div class="caption">Take Me Back — Summer</div></a>
<a class="card" href="Take Me Back — Kirillovec rmx WINTER.jpeg" target="_blank" rel="noopener"><img src="Take Me Back — Kirillovec rmx WINTER.jpeg" alt="Take Me Back — Winter" width="400" height="280" loading="lazy" decoding="async"><div class="caption">Take Me Back — Winter</div></a>
</div>
<footer>
  <a href="/">← На главную</a>
  <a href="/artist/">Музыка</a>
  <a href="/творчество/">Творчество</a>
</footer>
</main>
<script>
document.querySelectorAll(".gallery img").forEach((img) => {
  img.addEventListener("error", () => {
    const fb = img.getAttribute("data-fallback");
    if (fb && !img.dataset.retried) {
      img.dataset.retried = "1";
      img.src = fb;
      const a = img.closest("a");
      if (a) a.href = fb;
      return;
    }
    img.alt = "Файл изображения пока не загружен";
    img.closest(".card")?.classList.add("media-error");
  }, { once: false });
});
</script>
</body>
</html>
