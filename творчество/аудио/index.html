<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аудио — Творчество</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0a0a0b; --bg-card:#121214; --text:#e8e6e3; --text-muted:#8a8780; --accent:#c4a77d; --border:rgba(255,255,255,0.06); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    .wrap { max-width:900px; margin:0 auto; padding:48px 24px 80px; }
    a.back { color:var(--text-muted); text-decoration:none; font-size:0.9rem; }
    a.back:hover { color:var(--accent); }
    h1 { font-family:'Playfair Display',serif; font-size:clamp(2rem,5vw,3rem); font-weight:400; margin:32px 0 12px; }
    p.desc { color:var(--text-muted); font-weight:300; margin-bottom:40px; }
    .empty { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:48px; text-align:center; color:var(--text-muted); }
    .item { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:24px 28px; margin-bottom:16px; }
    .item h3 { font-family:'Playfair Display',serif; font-size:1.3rem; margin-bottom:6px; }
    .item p { color:var(--text-muted); font-size:0.9rem; }
    .item a { color:var(--accent); text-decoration:none; font-size:0.9rem; }
    .item a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/творчество/">← Творчество</a>
    <h1>🎧 Аудио</h1>
    <p class="desc">Треки, синглы, демо, звуковые эксперименты</p>

    <div class="item">
      <h3>НИЗКО</h3>
      <p>Сингл · русский рэп · hip hop · lo-fi · 2026</p>
      <p style="margin-top:12px">
        <a href="https://music.yandex.ru/album/44176131" target="_blank" rel="noopener">Яндекс Музыка</a> ·
        <a href="https://music.vk.com/link/UgGXp" target="_blank" rel="noopener">VK</a> ·
        <a href="https://zvuk.com/release/53157423" target="_blank" rel="noopener">Звук</a> ·
        <a href="https://band.link/y17UF" target="_blank" rel="noopener">Band.link</a>
      </p>
    </div>

    <div class="item">
      <h3>Suno</h3>
      <p>95+ треков · dark downtempo, Russian rap, lo-fi, ambient</p>
      <p style="margin-top:12px"><a href="https://suno.com/@kirillovec77" target="_blank" rel="noopener">Открыть профиль →</a></p>
    </div>
  </div>
</body>
</html>
