name = "kirillovec-ai-studio-api"
main = "src/index.js"
compatibility_date = "2026-10-15"
workers_dev = false

[vars]
ACCESS_REQUIRED = "false"
MAX_JOBS_PER_HOUR = "10"
MAX_MUSIC_PER_HOUR = "5"
ALLOWED_ORIGINS = "https://kirillovec.ru,https://www.kirillovec.ru"
SUNO_API_BASE = "https://api.sunoapi.org"

# Secrets (wrangler secret put):
# SUNO_API_KEY, REPLICATE_API_TOKEN, RESEND_API_KEY, SELF_HOSTED_API_TOKEN

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "kirillovec-ai-studio"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Optional: create bucket first — npx wrangler r2 bucket create kirillovec-music
# Then uncomment:
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "kirillovec-music"

[[send_email]]
name = "EMAIL"
