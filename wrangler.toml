name = "kirillovec-ai-studio-api"
main = "src/index.js"
compatibility_date = "2026-10-15"
workers_dev = false

[vars]
# Cloudflare Access protects the custom API hostname; Worker JWT validation is optional.
# Keep false unless ACCESS_TEAM_DOMAIN and ACCESS_AUD are configured in Production.
ACCESS_REQUIRED = "false"
MAX_JOBS_PER_HOUR = "10"
ALLOWED_ORIGINS = "https://kirillovec.ru,https://www.kirillovec.ru"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "kirillovec-ai-studio"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Add a KV namespace binding named JWKS_CACHE to cache Access signing keys.
# Configure secrets and variables in Cloudflare Worker settings. See docs/AI-STUDIO-DEPLOYMENT.md.
