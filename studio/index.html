<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0d">
<title>AI Studio — kirillovec</title>
<meta name="description" content="AI Studio kirillovec — рабочее пространство для генерации изображений и видео.">
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--panel:#121216;--line:#292930;--muted:#92929e;--text:#f4f3f7;--accent:#c9a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 26px}
h1{margin:0 0 8px;font-size:22px;letter-spacing:-.3px}
p{color:var(--muted);margin:0 0 18px;line-height:1.55}
.actions{display:flex;flex-wrap:wrap;gap:10px}
a.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:10px;background:linear-gradient(135deg,#e1cfff,#9670e7);color:#17121f;font-weight:700;text-decoration:none}
a.ghost{display:inline-flex;padding:11px 16px;border-radius:10px;border:1px solid var(--line);color:var(--text);text-decoration:none}
a.ghost:hover{border-color:#3d344e}
code{font-size:12px;color:#c9a7ff}
</style>
</head>
<body>
  <div class="card">
    <h1>AI Studio</h1>
    <p>Интерфейс временно восстановлен в безопасном режиме. Полный UI с генерацией возвращаем — исходный полный snapshot лежит в коммите <code>be9b990</code>.</p>
    <p>Пока доступны витрина и музыка.</p>
    <div class="actions">
      <a class="btn" href="/">← На главную</a>
      <a class="ghost" href="/творчество/">Творчество</a>
      <a class="ghost" href="/творчество/аудио/">Слушать «НИЗКО»</a>
    </div>
  </div>
</body>
</html>
