<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Studio — kirillovec</title>
<meta name="theme-color" content="#0b0b0d">
<style>body{margin:0;background:#0b0b0d;color:#aaa;font:14px system-ui;display:grid;place-items:center;min-height:100vh;padding:24px}a{color:#c9a7ff}</style>
</head>
<body>
<p id="s">Загрузка Studio…</p>
<script>
(async function () {
  var urls = [
    "https://cdn.jsdelivr.net/gh/kirillovec/kirillovec@7944e1f9/studio/index.html",
    "https://raw.githubusercontent.com/kirillovec/kirillovec/7944e1f9/studio/index.html"
  ];
  var html = null;
  for (var i = 0; i < urls.length; i++) {
    try {
      var r = await fetch(urls[i] + (urls[i].indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now());
      if (r.ok) { html = await r.text(); break; }
    } catch (e) {}
  }
  if (!html) {
    document.getElementById("s").innerHTML = "Не удалось загрузить Studio. Обнови страницу или открой <a href=https://github.com/kirillovec/kirillovec>GitHub</a>";
    return;
  }
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
