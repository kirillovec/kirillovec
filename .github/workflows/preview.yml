name: Preview deploy on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare preview files
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='src' --exclude='migrations' \
            --exclude='node_modules' --exclude='.github' --exclude='docs' \
            --exclude='wrangler.toml' --exclude='*.md' \
            ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.deployment.outputs.page_url }}`;
            const body = `### Preview ready\n\n🔗 ${url}\n\nПроверь изменения перед мержем в main.`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
