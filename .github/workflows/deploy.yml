name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-ai-studio-api.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir -p _site
          # Copy only what is needed for the public site
          rsync -a --exclude='.git' --exclude='src' --exclude='migrations' \
            --exclude='node_modules' --exclude='.github' --exclude='docs' \
            --exclude='wrangler.toml' --exclude='*.md' --exclude='.tmp' \
            ./ _site/

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for Pages artifact indexing
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
