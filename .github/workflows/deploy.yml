name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-ai-studio-api.yml"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate frontend JavaScript and script references
        run: |
          node --check studio/app.js
          node --check studio/suno-tools.js
          node --check studio/suno-pro-tools.js
          node --check studio/auth-banner.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          page = Path("studio/index.html")
          html = page.read_text(encoding="utf-8")
          refs = re.findall(r'<script[^>]+src=["\\']([^"\\']+)', html)
          missing = [src for src in refs if not src.startswith(("http://", "https://", "//")) and not (page.parent / src.split("?", 1)[0]).is_file()]
          if missing:
              raise SystemExit("Missing frontend scripts: " + ", ".join(missing))
          for required in ("suno-tools.js", "suno-pro-tools.js", "app.js"):
              if not any(src.split("?", 1)[0].endswith(required) for src in refs):
                  raise SystemExit("Required script is not included: " + required)
          print("Frontend syntax and script references are valid.")
          PY

      - name: Prepare site files
        run: |
          mkdir -p _site
          # Copy only what is needed for the public site
          rsync -a --exclude='.git' --exclude='src' --exclude='migrations' \
            --exclude='node_modules' --exclude='.github' --exclude='docs' \
            --exclude='wrangler.toml' --exclude='*.md' --exclude='.tmp' \
            ./ _site/

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for Pages artifact indexing
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
