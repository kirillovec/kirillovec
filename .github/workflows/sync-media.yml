name: Sync media assets

# Автопубликация медиа:
# 1. Залей файлы через GitHub UI (Add file → Upload):
#    - творчество/фото/2.jpg
#    - творчество/видео/nizko_promo.mp4
# 2. workflow deploy.yml сам выкатит сайт на Pages.
# Этот workflow можно запускать вручную (Actions → Sync media → Run).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Media status
        run: |
          echo "=== Фото ==="
          ls -la "творчество/фото/" 2>/dev/null || true
          echo "=== Видео ==="
          ls -la "творчество/видео/" 2>/dev/null || true
          if [ -f "творчество/фото/2.jpg" ]; then
            echo "OK: 2.jpg present ($(wc -c < творчество/фото/2.jpg) bytes)"
          else
            echo "TODO: upload творчество/фото/2.jpg"
          fi
          if [ -f "творчество/видео/nizko_promo.mp4" ]; then
            echo "OK: nizko_promo.mp4 present"
          else
            echo "TODO: upload творчество/видео/nizko_promo.mp4"
          fi
