name: Sync media assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'творчество/фото/2.jpg.b64'
      - '.github/workflows/sync-media.yml'

permissions:
  contents: write

jobs:
  sync-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode 2.jpg from base64 text
        run: |
          mkdir -p "творчество/фото"
          if [ -f "творчество/фото/2.jpg.b64" ]; then
            base64 -d "творчество/фото/2.jpg.b64" > "творчество/фото/2.jpg"
            ls -la "творчество/фото/2.jpg"
          else
            echo "No b64 source"
            exit 0
          fi
      - name: Commit decoded image
        run: |
          git config user.name "kirillovec-bot"
          git config user.email "296966519+kirillovec@users.noreply.github.com"
          git add "творчество/фото/2.jpg"
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "media: decode and publish 2.jpg"
            git push
          fi
