name: Validate AI Studio
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check studio/config.js
      - name: Verify required files
        run: |
          test -s studio/index.html
          test -s studio/config.js
          test -s migrations/0001_initial.sql
          test -s wrangler.toml
          test -s docs/AI-STUDIO-DEPLOYMENT.md
