name: Validate AI Studio
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check studio/config.js
          node --check studio/app.js
      - name: Verify required files
        run: |
          test -s studio/index.html
          test -s studio/config.js
          test -s studio/app.js
          grep -q 'id="project-list"' studio/index.html
          grep -q 'function renderProjects' studio/app.js
          grep -q 'maxEdge = 496' studio/app.js
          grep -q 'id="file-input"' studio/index.html
          grep -q 'id="generate"' studio/index.html
          grep -q 'id="api-status"' studio/index.html
          grep -q 'giga.chat' studio/index.html
          grep -q 'shedevrum.ai' studio/index.html
          ! grep -q 'googletagmanager.com' index.html
          grep -q 'Основной API недоступен' studio/app.js
          grep -q 'включить VPN' studio/app.js
          grep -q 'Доступность из России' studio/index.html
          grep -q 'Сам сайт, конструкторы промптов' studio/index.html
          grep -q 'id="copy-image-prompt"' studio/index.html
          grep -q 'id="import-projects"' studio/index.html
          grep -q 'importProjectsInput' studio/app.js
          grep -q 'data-prompt="restore"' studio/index.html
          grep -q 'function loadCapabilities' studio/app.js
          grep -q 'function loadCapabilities' studio/app.js
          ! grep -q 'fetch(apiBase + "/api/v1/music/generate"' studio/app.js
          test -s migrations/0001_initial.sql
          test -s wrangler.toml
          test -s docs/AI-STUDIO-DEPLOYMENT.md
          test -f .nojekyll
          test -s llms.txt
          test -s robots.txt
          test -s sitemap.xml
          test -s guides/index.html
          test -s guides/rap-cover-prompt/index.html
          test -s guides/gray-background-photo/index.html
          grep -q 'GPTBot' robots.txt
          grep -q 'ClaudeBot' robots.txt
          grep -q 'PerplexityBot' robots.txt
          grep -q 'SoftwareApplication' index.html
          grep -q 'rap-cover-prompt' sitemap.xml
          grep -q 'AI STUDIO' index.html

      - name: Validate sitemap and structured data
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path

          ET.parse("sitemap.xml")

          class JsonLdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and dict(attrs).get("type") == "application/ld+json":
                      self.capture = True
                      self.parts = []
              def handle_data(self, data):
                  if self.capture:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.capture:
                      json.loads("".join(self.parts))
                      self.capture = False

          for path in ["index.html", "studio/index.html", "guides/rap-cover-prompt/index.html", "guides/gray-background-photo/index.html"]:
              parser = JsonLdParser()
              parser.feed(Path(path).read_text(encoding="utf-8"))
          PY
